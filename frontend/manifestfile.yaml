---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: roboshop
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log notice;
    pid /run/nginx.pid;

    include /usr/share/nginx/modules/*.conf;

    events {
        worker_connections 1024;
    }

    http {
        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

        access_log  /var/log/nginx/access.log  main;

        sendfile            on;
        tcp_nopush          on;
        keepalive_timeout   65;
        types_hash_max_size 4096;

        include             /etc/nginx/mime.types;
        default_type        application/octet-stream;

        include /etc/nginx/conf.d/*.conf;

        server {
            listen       80;
            listen       [::]:80;
            server_name  _;
            root         /usr/share/nginx/html;

            include /etc/nginx/default.d/*.conf;

            error_page 404 /404.html;
            location = /404.html {
            }

            error_page 500 502 503 504 /50x.html;
            location = /50x.html {
            }

            location /images/ {
              expires 5s;
              root   /usr/share/nginx/html;
              try_files $uri /images/placeholder.jpg;
            }
            location /api/catalogue/ { proxy_pass http://catalogue-service:8080/; }
            location /api/user/ { proxy_pass http://user-service:8080/; }
            location /api/cart/ { proxy_pass http://cart-service:8080/; }
            location /api/shipping/ { proxy_pass http://shipping-service:8080/; }
            location /api/payment/ { proxy_pass http://payment-service:8080/; }

            location /health {
              stub_status on;
              access_log off;
            }

        }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: robpshop
  labels:
    project: roboshop
    tier: frontend
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      tier: frontend
      component: frontend
  template:
    metadata:
      labels:
        project: roboshop
        tier: frontend
        component: frontend
    spec:
      serviceAccountName: frontend-service-account
      containers:
        - name: frontend-cont
          image: meghashyam792/roboshop:frontend
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: frontend-port
          resources:
            requests:
              cpu: "200m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "25Mi"
          readinessProbe:
            httpGet:
              path: /
              port: frontend-port
            failureThreshold: 2
            initialDelaySeconds: 50
            periodSeconds: 50
            timeoutSeconds: 20
          livenessProbe:
            httpGet:
              path: /
              port: frontend-port
            failureThreshold: 2
            initialDelaySeconds: 50
            periodSeconds: 50
            timeoutSeconds: 20
          volumeMounts:
            - name: frontend-volume
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: frontend-volume
          configMap:
            name: frontend-config

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: roboshop
spec:
  type: LoadBalancer
  selector:
    project: roboshop
    tier: frontend
    component: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      name: frontend-port

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
  namespace: roboshop
spec:
  scaleTargetRef:
    apiVersion: v1
    kind: Deployment
    name: frontend
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-service-account
  namespace: roboshop
  labels:
    project: roboshop
    tier: frontend
    component: frontend